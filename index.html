<style>
:root{--navy:#031E33;--navy-2:#0B2C47;--copper:#C9913F;--copper-2:#E0A33C;--ink:#13263A;--muted:#5D7186;--line:#D5DDE5;--err:#C2483A}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 30% 20%,#0B2C47,#031E33 70%);font-family:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px;color:#fff}
.card{width:100%;max-width:380px;background:#fff;color:var(--ink);border-radius:12px;padding:32px 28px;box-shadow:0 20px 60px rgba(0,0,0,.35);border-top:4px solid var(--copper)}
.brand{margin:-32px -28px 22px;padding:18px 24px;background:#021B2F;border-radius:8px 8px 0 0;text-align:center}.brand img{display:block;max-width:100%;height:auto;margin:0 auto}
h1{font-size:20px;margin:0 0 4px;color:var(--navy)}
p{margin:0 0 20px;color:var(--muted);font-size:14px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.row{position:relative}
input[type=password],input[type=text]{width:100%;padding:11px 44px 11px 12px;font-size:15px;border:1px solid var(--line);border-radius:8px;outline:none;font-family:inherit}
input:focus{border-color:var(--copper);box-shadow:0 0 0 3px rgba(201,145,63,.2)}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;color:var(--muted);font-size:13px;padding:6px}
button.go{margin-top:16px;width:100%;padding:12px;border:0;border-radius:8px;background:var(--navy);color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
button.go:hover{background:var(--navy-2)}
button.go:disabled{opacity:.6;cursor:wait}
.err{color:var(--err);font-size:13px;min-height:18px;margin-top:10px}
.foot{margin-top:14px;font-size:12px;color:var(--muted);text-align:center}
</style>
</head>

const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const pw=document.getElementById('pw'),go=document.getElementById('go'),err=document.getElementById('err');
document.getElementById('eye').onclick=e=>{const t=pw.type==='password';pw.type=t?'text':'password';e.target.textContent=t?'Hide':'Show';pw.focus();};
async function unlock(p){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(SALT),iterations:IT,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(IV)},key,u8(CT));
  const stream=new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).text();
}
document.getElementById('f').onsubmit=async e=>{
  e.preventDefault();err.textContent='';go.disabled=true;go.textContent='Unlocking…';
  let html;
  try{html=await unlock(pw.value);}
  catch(x){err.textContent='Incorrect password. Please try again.';go.disabled=false;go.textContent='Unlock';pw.select();return;}
  document.open();document.write(html);document.close();
};
</script>
